<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYCRAFT AI - JUEGOS SIN PANTALLAS</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #F4EFEB;            /* Marfil cálido */
            --border-dark: #121212;
            
            /* Nueva Paleta Vibrante */
            --color-purple: #7029ED;       /* Púrpura Eléctrico */
            --color-yellow: #FFD200;       /* Amarillo Sol */
            --color-cyan: #00E5FF;         /* Cían brillante */
            --color-coral: #FF4365;        /* Coral / Rojo Vivo */
            --color-mint: #00E676;         /* Verde Menta */
            --text-dark: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            text-transform: uppercase;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.4;
            padding: 24px 16px;
            max-width: 800px;
            margin: 0 auto;
            font-weight: 400;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        /* Título Principal: Texto Púrpura sobre Fondo Amarillo */
        .title-block-1 {
            display: inline-block;
            background: var(--color-yellow);
            padding: 12px 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 5px 5px 0px var(--border-dark);
            transform: rotate(-1.5deg);
        }

        .title-block-1 h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--color-purple);
            letter-spacing: 1px;
        }

        header p {
            color: var(--color-coral);
            font-size: 0.95rem;
            font-weight: 800;
            margin-top: 14px;
        }

        /* Contenedor principal Cían */
        .card {
            background: var(--color-cyan);
            border-radius: 20px;
            padding: 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
            margin-bottom: 28px;
            color: var(--text-dark);
        }

        .card-result {
            background: #FFFFFF;
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            background: #FFF;
            color: var(--text-dark);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            background: #FFF;
            color: var(--text-dark);
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
            box-shadow: 2px 2px 0px var(--border-dark);
            transition: all 0.15s;
        }

        .checkbox-label input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--color-purple);
        }

        /* Botón 1: Texto Púrpura sobre Fondo Menta */
        .btn {
            width: 100%;
            background: var(--color-mint);
            color: var(--color-purple);
            border: 3px solid var(--border-dark);
            padding: 14px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-dark);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2deg);
            box-shadow: 6px 6px 0px var(--border-dark);
        }

        /* Botón 2: Texto Amarillo sobre Fondo Púrpura */
        .btn-demo {
            background: var(--color-purple);
            color: var(--color-yellow);
            margin-top: 12px;
        }

        /* Contenedor API Key: Texto Coral sobre Fondo Amarillo */
        #api-key-container {
            background: var(--color-yellow);
            border: 3px solid var(--border-dark);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-dark);
        }

        #api-key-container label {
            color: var(--color-coral);
            font-weight: 900;
        }

        #result {
            display: none;
            position: relative;
            overflow: hidden;
        }

        .game-header-banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid var(--border-dark);
            margin-bottom: 20px;
        }

        /* Título del Juego: Texto Cían sobre Fondo Coral */
        .game-title {
            display: inline-block;
            background: var(--color-coral);
            color: var(--color-cyan);
            padding: 10px 16px;
            border: 3px solid var(--border-dark);
            box-shadow: 4px 4px 0px var(--border-dark);
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            border: 2px solid var(--border-dark);
        }

        .badge-1 { background: var(--color-yellow); color: var(--color-purple); }
        .badge-2 { background: var(--color-mint); color: var(--text-dark); }
        .badge-3 { background: var(--color-cyan); color: var(--color-purple); }

        .game-section {
            background: #FAF6ED;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .game-section h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            padding: 6px 12px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--border-dark);
        }

        /* Combinaciones de color en los subtítulos de resultado */
        .section-adult h3 { background: var(--color-mint); color: var(--color-purple); }
        .section-kids h3 { background: var(--color-purple); color: var(--color-yellow); }
        .section-steps h3 { background: var(--color-coral); color: var(--color-cyan); }
        .section-extra h3 { background: var(--color-yellow); color: var(--color-coral); }

        .game-section p, .game-section ol {
            font-weight: 500;
        }

        .game-section ol {
            padding-left: 20px;
        }

        .game-section ol li {
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            background: white;
            border-radius: 20px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--color-purple);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .safety-box {
            background: #FFEBEB;
            border: 3px solid var(--color-coral);
            padding: 14px;
            border-radius: 14px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #990000;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-block-1">
            <h1>PLAYCRAFT AI</h1>
        </div>
        <p>JUEGOS FISICOS Y MANUALIDADES 100% SIN PANTALLAS</p>
    </header>

    <div id="api-key-container">
        <label for="apiKey"><i data-lucide="key"></i> OPENAI API KEY (OPCIONAL PARA PRUEBAS):</label>
        <input type="text" id="apiKey" placeholder="SK-PROJ-...">
        <small style="color: var(--text-dark); display: block; margin-top: 6px; font-weight: 800;">SI NO TIENES KEY, PRESIONA EL BOTON AZUL DE PROBAR CON RESPUESTA DE PRUEBA.</small>
    </div>

    <div class="card">
        <form id="gameForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="numKids"><i data-lucide="users"></i> N DE NINOS:</label>
                    <input type="number" id="numKids" min="1" max="10" value="2" required>
                </div>
                <div class="form-group">
                    <label for="ages"><i data-lucide="baby"></i> EDADES:</label>
                    <input type="text" id="ages" value="4 Y 6 ANOS" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="location"><i data-lucide="map-pin"></i> UBICACION:</label>
                    <select id="location">
                        <option value="Interior (Casa / Depto)">INTERIOR (CASA)</option>
                        <option value="Exterior (Patio / Parque)">EXTERIOR (PATIO/PARQUE)</option>
                        <option value="Espacio muy reducido">ESPACIO REDUCIDO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="energy"><i data-lucide="zap"></i> DINAMICA:</label>
                    <select id="energy">
                        <option value="Alta energía (Moverse, carreras)">MOVERSE / CARRERAS</option>
                        <option value="Creativo y Manualidades">CREATIVO / ARTE</option>
                        <option value="Tranquilo y Trabajo en equipo">LOGICA / TRANQUILO</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i data-lucide="box"></i> MATERIALES DISPONIBLES:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" value="Papel y lápices" checked> PAPEL / LAPICES</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cajas de cartón"> CARTON</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cinta adhesiva" checked> CINTA</label>
                    <label class="checkbox-label"><input type="checkbox" value="Globos"> GLOBOS</label>
                    <label class="checkbox-label"><input type="checkbox" value="Calcetines o Cojines" checked> CALCETINES</label>
                    <label class="checkbox-label"><input type="checkbox" value="Ninguno (Solo imaginación)"> SOLO MENTE</label>
                </div>
            </div>

            <button type="submit" class="btn"><i data-lucide="sparkles"></i> GENERAR JUEGO CON IA</button>
            <button type="button" id="btnMock" class="btn btn-demo"><i data-lucide="play-circle"></i> PROBAR CON RESPUESTA DE PRUEBA</button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="font-weight: 800; font-size: 1.1rem; color: var(--color-purple);">INVENTANDO UNA SUPER AVENTURA SEGURA...</p>
    </div>

    <div class="card card-result" id="result">
        <!-- Ficha de juego -->
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('INGRESA TU OPENAI API KEY O USA EL BOTON AZUL DE RESPUESTA DE PRUEBA.');
                return;
            }
            await generateGame(apiKey);
        });

        document.getElementById('btnMock').addEventListener('click', () => {
            showMockResult();
        });

        const categoryImages = {
            'Alta energía (Moverse, carreras)': 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80',
            'Creativo y Manualidades': 'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=800&q=80',
            'Tranquilo y Trabajo en equipo': 'https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=800&q=80'
        };

        async function generateGame(apiKey) {
            const numKids = document.getElementById('numKids').value;
            const ages = document.getElementById('ages').value;
            const location = document.getElementById('location').value;
            const energy = document.getElementById('energy').value;
            
            const materials = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                                   .map(cb => cb.value).join(', ') || 'NINGUNO';

            const systemPrompt = `Eres un experto en pedagogía infantil. Tu trabajo es diseñar un juego FÍSICO Y DESCONECTADO.
REGLAS ABSOLUTAS:
1. NUNCA sugieras pantallas, apps, videos o búsquedas en internet.
2. Formato strictly JSON con los campos: "titulo", "duracion", "preparacion_adulto", "materiales_usados", "reglas_ninos", "pasos_juego", "variante_dificil", "nota_seguridad".
3. Tono apto para todo público, divertido y seguro. Cero peligros físicos.`;

            const userPrompt = `Crea un juego para ${numKids} niños de ${ages}.
Ubicación: ${location}.
Tipo de juego: ${energy}.
Materiales disponibles: ${materials}.`;

            showLoading(true);

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        response_format: { type: "json_object" },
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) {
                    alert('ERROR DE API: ' + data.error.message);
                } else {
                    const gameData = JSON.parse(data.choices[0].message.content);
                    renderGame(gameData, categoryImages[energy]);
                }
            } catch (err) {
                alert('ERROR AL CONECTAR CON LA API: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function renderGame(data, imageUrl) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            let pasosHTML = data.pasos_juego.map(paso => `<li>${paso}</li>`).join('');

            resultDiv.innerHTML = `
                <img src="${imageUrl || 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80'}" class="game-header-banner" alt="JUEGO PARA NINOS">
                
                <h2 class="game-title">${data.titulo}</h2>

                <div class="badges-container">
                    <div class="badge badge-1"><i data-lucide="clock" size="16"></i> ${data.duracion || '20 MIN'}</div>
                    <div class="badge badge-2"><i data-lucide="package" size="16"></i> ${data.materiales_usados || 'SIMPLES'}</div>
                    <div class="badge badge-3"><i data-lucide="shield-check" size="16"></i> 100% SEGURO</div>
                </div>
                
                <div class="game-section section-adult">
                    <h3><i data-lucide="wrench" size="18"></i> PREPARACION PARA EL ADULTO:</h3>
                    <p>${data.preparacion_adulto || 'NINGUNA. LISTOS PARA ARRANCAR.'}</p>
                </div>

                <div class="game-section section-kids" style="background: #EBF3FF;">
                    <h3><i data-lucide="mega-phone" size="18"></i> INSTRUCCIONES PARA LOS NINOS:</h3>
                    <p style="font-weight: 800; color: var(--color-purple);">"${data.reglas_ninos}"</p>
                </div>

                <div class="game-section section-steps">
                    <h3><i data-lucide="gamepad-2" size="18"></i> PASOS DEL JUEGO:</h3>
                    <ol>${pasosHTML}</ol>
                </div>

                ${data.variante_dificil ? `
                <div class="game-section section-extra" style="background: #FFF0F5;">
                    <h3><i data-lucide="zap" size="18"></i> MODO DESAFIO EXTRA:</h3>
                    <p>${data.variante_dificil}</p>
                </div>` : ''}

                <div class="safety-box">
                    <strong>NOTA DE SEGURIDAD:</strong> ${data.nota_seguridad || 'ASEGURATE DE DESPEJAR LA ZONA DE JUEGO DE OBJETOS TROPEZABLES.'}
                </div>
            `;
            
            lucide.createIcons();
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showMockResult() {
            showLoading(true);
            const energy = document.getElementById('energy').value;
            setTimeout(() => {
                showLoading(false);
                renderGame({
                    titulo: "EL PUENTE MAGICO DE CALCETINES",
                    duracion: "20 MINUTOS",
                    materiales_usados: "CALCETINES Y CINTA",
                    preparacion_adulto: "PEGA DOS TIRAS DE CINTA EN EL SUELO PARA DELIMITAR EL RIO MISTICO.",
                    reglas_ninos: "EL SUELO DEL SALON ES UN LAGO DE LAVA HIRVIENDO. PARA CRUZARLO SOLO PUEDEN SALTAR DE ISLA EN ISLA USANDO LOS CALCETINES.",
                    pasos_juego: [
                        "CADA JUGADOR RECIBE 3 PARES DE CALCETINES HECHOS PELOTA.",
                        "DEBEN IR LANZANDO UN CALCETIN HACIA ADELANTE PARA CONSTRUIR SU CAMINO SEGURO.",
                        "TIENEN QUE RESCATAR LOS TESOROS DE PAPEL EN EL OTRO EXTREMO Y VOLVER A LA ORILLA."
                    ],
                    variante_dificil: "SI HAY NINOS MAS GRANDES, SOLO PUEDEN AVANZAR DANDO SALTOS EN UN SOLO PIE.",
                    nota_seguridad: "RETIRAR MESAS O SILLAS CON ESQUINAS PRONUNCIADAS CERCA DEL AREA DE SALTOS."
                }, categoryImages[energy]);
            }, 700);
        }

        function showLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
            if (isLoading) document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
