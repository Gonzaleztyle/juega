<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCraft AI 🎲 - Juegos Sin Pantallas</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #FAF6ED;         /* Crema cálido */
            --card-bg: #FFFFFF;        /* Blanco */
            --primary: #0A52E2;        /* Azul eléctrico */
            --primary-dark: #0639A0;
            --accent-orange: #FF4500;   /* Naranja neón */
            --accent-green: #008B4B;    /* Verde */
            --accent-yellow: #FFD000;   /* Amarillo brillante */
            --accent-pink: #F7A8B8;     /* Rosado dulce */
            --text-dark: #1A1A1A;
            --border-dark: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.5;
            padding: 24px 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-box {
            display: inline-block;
            background: var(--accent-yellow);
            padding: 8px 16px;
            border-radius: 16px;
            border: 3px solid var(--border-dark);
            box-shadow: 4px 4px 0px var(--border-dark);
            margin-bottom: 12px;
            transform: rotate(-2deg);
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 700;
        }

        header p {
            color: #4A4A4A;
            font-size: 1rem;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            background: #FFF;
            transition: transform 0.1s;
        }

        input:focus, select:focus {
            background: #F0F6FF;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            background: #FFF;
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
            box-shadow: 2px 2px 0px var(--border-dark);
            transition: all 0.15s;
        }

        .checkbox-label:hover {
            transform: translateY(-2deg);
            background: var(--accent-pink);
        }

        .checkbox-label input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .btn {
            width: 100%;
            background: var(--accent-orange);
            color: white;
            border: 3px solid var(--border-dark);
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-dark);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2deg);
            box-shadow: 6px 6px 0px var(--border-dark);
            background: #E03E00;
        }

        .btn:active {
            transform: translateY(2deg);
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        .btn-demo {
            background: var(--primary);
            margin-top: 12px;
        }

        .btn-demo:hover {
            background: var(--primary-dark);
        }

        #api-key-container {
            background: var(--accent-pink);
            border: 3px solid var(--border-dark);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-dark);
        }

        #result {
            display: none;
            position: relative;
            overflow: hidden;
        }

        .game-header-banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid var(--border-dark);
            margin-bottom: 20px;
        }

        .game-title {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-yellow);
            color: var(--text-dark);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 2px solid var(--border-dark);
        }

        .badge-green { background: var(--accent-green); color: white; }
        .badge-pink { background: var(--accent-pink); }

        .game-section {
            background: #FAF6ED;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .game-section h3 {
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .game-section ol {
            padding-left: 20px;
            font-weight: 600;
        }

        .game-section ol li {
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            background: white;
            border-radius: 20px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--accent-orange);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .safety-box {
            background: #FFEBEB;
            border: 3px solid var(--accent-orange);
            padding: 14px;
            border-radius: 14px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #990000;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <h1>🎨 PlayCraft AI</h1>
        </div>
        <p>Juegos físicos y manualidades 100% Sin Pantallas</p>
    </header>

    <div id="api-key-container">
        <label for="apiKey"><i data-lucide="key"></i> OpenAI API Key (Opcional para pruebas):</label>
        <input type="text" id="apiKey" placeholder="sk-proj-...">
        <small style="color: #4A4A4A; display: block; margin-top: 6px; font-weight: 600;">Si no pones Key, presiona el botón azul de "Respuesta de Prueba".</small>
    </div>

    <div class="card">
        <form id="gameForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="numKids"><i data-lucide="users"></i> Nº de Niños:</label>
                    <input type="number" id="numKids" min="1" max="10" value="2" required>
                </div>
                <div class="form-group">
                    <label for="ages"><i data-lucide="baby"></i> Edades:</label>
                    <input type="text" id="ages" value="4 y 6 años" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="location"><i data-lucide="map-pin"></i> Ubicación:</label>
                    <select id="location">
                        <option value="Interior (Casa / Depto)">🏠 Interior (Casa)</option>
                        <option value="Exterior (Patio / Parque)">🌳 Exterior (Patio/Parque)</option>
                        <option value="Espacio muy reducido">📦 Espacio reducido</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="energy"><i data-lucide="zap"></i> Dinámica:</label>
                    <select id="energy">
                        <option value="Alta energía (Moverse, carreras)">🏃 Moverse / Carreras</option>
                        <option value="Creativo y Manualidades">🎨 Creativo / Arte</option>
                        <option value="Tranquilo y Trabajo en equipo">🧠 Lógica / Tranquilo</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i data-lucide="box"></i> Materiales disponibles:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" value="Papel y lápices" checked> 📝 Papel/Lápices</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cajas de cartón"> 📦 Cartón</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cinta adhesiva" checked> 🩹 Cinta</label>
                    <label class="checkbox-label"><input type="checkbox" value="Globos"> 🎈 Globos</label>
                    <label class="checkbox-label"><input type="checkbox" value="Calcetines o Cojines" checked> 🧦 Calcetines</label>
                    <label class="checkbox-label"><input type="checkbox" value="Ninguno (Solo imaginación)"> 🧠 Solo Mente</label>
                </div>
            </div>

            <button type="submit" class="btn"><i data-lucide="sparkles"></i> Generar Juego con IA</button>
            <button type="button" id="btnMock" class="btn btn-demo"><i data-lucide="play-circle"></i> Probar con Respuesta de Prueba</button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="font-weight: 700; font-size: 1.1rem; color: var(--primary);">¡Inventando una súper aventura segura!</p>
    </div>

    <div class="card" id="result">
        <!-- Ficha de juego -->
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('Ingresa tu OpenAI API Key o usa el botón azul de "Respuesta de Prueba".');
                return;
            }
            await generateGame(apiKey);
        });

        document.getElementById('btnMock').addEventListener('click', () => {
            showMockResult();
        });

        // Imágenes de Unsplash según categoría
        const categoryImages = {
            'Alta energía (Moverse, carreras)': 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80',
            'Creativo y Manualidades': 'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=800&q=80',
            'Tranquilo y Trabajo en equipo': 'https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=800&q=80'
        };

        async function generateGame(apiKey) {
            const numKids = document.getElementById('numKids').value;
            const ages = document.getElementById('ages').value;
            const location = document.getElementById('location').value;
            const energy = document.getElementById('energy').value;
            
            const materials = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                                   .map(cb => cb.value).join(', ') || 'Ninguno';

            const systemPrompt = `Eres un experto en pedagogía infantil. Tu trabajo es diseñar un juego FÍSICO Y DESCONECTADO.
REGLAS ABSOLUTAS:
1. NUNCA sugieras pantallas, apps, videos o búsquedas en internet.
2. Formato estrictamente JSON con los campos: "titulo", "duracion", "preparacion_adulto", "materiales_usados", "reglas_ninos", "pasos_juego", "variante_dificil", "nota_seguridad".
3. Tono apto para todo público, divertido y seguro. Cero peligros físicos.`;

            const userPrompt = `Crea un juego para ${numKids} niños de ${ages}.
Ubicación: ${location}.
Tipo de juego: ${energy}.
Materiales disponibles: ${materials}.`;

            showLoading(true);

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        response_format: { type: "json_object" },
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) {
                    alert('Error de API: ' + data.error.message);
                } else {
                    const gameData = JSON.parse(data.choices[0].message.content);
                    renderGame(gameData, categoryImages[energy]);
                }
            } catch (err) {
                alert('Error al conectar con la API: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function renderGame(data, imageUrl) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            let pasosHTML = data.pasos_juego.map(paso => `<li>${paso}</li>`).join('');

            resultDiv.innerHTML = `
                <img src="${imageUrl || 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80'}" class="game-header-banner" alt="Juego para niños">
                
                <h2 class="game-title">🏆 ${data.titulo}</h2>

                <div class="badges-container">
                    <div class="badge"><i data-lucide="clock" size="16"></i> ${data.duracion || '20 min'}</div>
                    <div class="badge badge-green"><i data-lucide="package" size="16"></i> ${data.materiales_usados || 'Simples'}</div>
                    <div class="badge badge-pink"><i data-lucide="shield-check" size="16"></i> 100% Seguro</div>
                </div>
                
                <div class="game-section">
                    <h3>🛠️ Preparación para el Adulto:</h3>
                    <p style="font-weight: 600;">${data.preparacion_adulto || '¡Ninguna! Listos para arrancar.'}</p>
                </div>

                <div class="game-section" style="background: #EBF3FF;">
                    <h3>📢 Instrucciones para los niños:</h3>
                    <p style="font-style: italic; font-weight: 600; color: var(--primary);">"${data.reglas_ninos}"</p>
                </div>

                <div class="game-section">
                    <h3>🎮 Pasos del Juego:</h3>
                    <ol>${pasosHTML}</ol>
                </div>

                ${data.variante_dificil ? `
                <div class="game-section" style="background: #FFF9E6;">
                    <h3>⚡ Modo Desafío Extra:</h3>
                    <p style="font-weight: 600;">${data.variante_dificil}</p>
                </div>` : ''}

                <div class="safety-box">
                    <strong>🛡️ Nota de Seguridad:</strong> ${data.nota_seguridad || 'Asegúrate de despejar la zona de juego de objetos tropezables.'}
                </div>
            `;
            
            lucide.createIcons();
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showMockResult() {
            showLoading(true);
            const energy = document.getElementById('energy').value;
            setTimeout(() => {
                showLoading(false);
                renderGame({
                    titulo: "El Puente Mágico de Calcetines",
                    duracion: "20 minutos",
                    materiales_usados: "Calcetines y Cinta",
                    preparacion_adulto: "Pega dos tiras de cinta en el suelo para delimitar el 'río místico'.",
                    reglas_ninos: "¡El suelo del salón es un lago de lava hirviendo! Para cruzarlo solo pueden saltar de isla en isla usando los calcetines.",
                    pasos_juego: [
                        "Cada jugador recibe 3 pares de calcetines hechos pelota.",
                        "Deben ir lanzando un calcetín hacia adelante para construir su camino seguro.",
                        "Tienen que rescatar los 'tesoros' de papel en el otro extremo y volver a la orilla."
                    ],
                    variante_dificil: "Si hay niños más grandes, solo pueden avanzar dando saltos en un solo pie.",
                    nota_seguridad: "Retirar mesas o sillas con esquinas pronunciadas cerca del área de saltos."
                }, categoryImages[energy]);
            }, 700);
        }

        function showLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
            if (isLoading) document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
