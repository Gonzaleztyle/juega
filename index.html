<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Juegos Infantiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E2E8F0;
            --card-bg: #FFFFFF;
            --border-color: #0F172A;
            --primary: #FF5964;
            --primary-hover: #E0434E;
            --secondary: #35A7FF;
            --accent: #FFE66D;
            --text-main: #0F172A;
            --radius: 16px;
            --shadow: 4px 4px 0px #0F172A;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #F8FAFC;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            font-size: 0.85rem;
            background: #F1F5F9;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #CBD5E1;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 3px 3px 0px var(--border-color);
            cursor: pointer;
            transition: all 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .btn-submit:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        /* Área de Carga */
        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #FFFBEB;
            border: 2px dashed #F59E0B;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Resultado del juego */
        #resultCard {
            display: none;
            margin-top: 24px;
            background: #F0FDF4;
            border: 3px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        #resultCard h2 {
            font-size: 1.5rem;
            color: #166534;
            margin-bottom: 12px;
            text-align: center;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #0F172A;
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #334155;
        }

        .steps-list {
            padding-left: 20px;
            margin-top: 4px;
        }

        .steps-list li {
            margin-bottom: 6px;
        }

        .rule-box {
            background: #FEF2F2;
            border-left: 4px solid #EF4444;
            padding: 8px 12px;
            margin-top: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #991B1B;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 Creador de Juegos Infantiles</h1>

    <form id="gameForm">
        <div class="row">
            <div class="form-group">
                <label for="numKids">👥 N° de Niños:</label>
                <input type="number" id="numKids" min="1" value="2" required>
            </div>
            <div class="form-group">
                <label for="ageRange">🎂 Edades:</label>
                <input type="text" id="ageRange" value="4 y 6 años" placeholder="Ej: 3 a 5 años" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="location">📍 Ubicación:</label>
                <select id="location">
                    <option value="Interior (Casa/Departamento)">Interior (Casa/Depto)</option>
                    <option value="Exterior (Jardín/Parque)">Exterior (Jardín/Parque)</option>
                    <option value="Espacio Reducido">Espacio Reducido</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dynamic">⚡ Dinámica:</label>
                <select id="dynamic">
                    <option value="Moverse / Carreras">Moverse / Carreras</option>
                    <option value="Tranquilo / Sentados">Tranquilo / Sentados</option>
                    <option value="Trabajo en equipo">Trabajo en equipo</option>
                    <option value="Busqueda del tesoro">Búsqueda del tesoro</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>📦 Materiales Disponibles:</label>
            <div class="materials-grid">
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Papel y lápices" checked> Papel y lápices</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cartón"> Cartón</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cinta adhesiva" checked> Cinta adhesiva</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Globos"> Globos</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Calcetines / Cojines" checked> Calcetines/Cojines</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Vasos plásticos"> Vasos plásticos</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Lana / Hilo"> Lana / Hilo</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Linterna"> Linterna</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Platos de papel"> Platos de papel</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Pinzas de ropa"> Pinzas de ropa</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Ninguno (Solo la mente)" checked> Solo mente</label>
            </div>
        </div>

        <button type="submit" class="btn-submit">✨ ¡CREAR JUEGO FÁCIL!</button>
    </form>

    <div id="loading">🚀 Creando un juego súper fácil de entender...</div>

    <div id="resultCard">
        <h2 id="gameTitle"></h2>
        
        <div class="section-title">🎯 Misión:</div>
        <p id="gameMission" class="section-content"></p>

        <div class="section-title">🛠️ Preparación rápida:</div>
        <p id="gamePrep" class="section-content"></p>

        <div class="section-title">🎮 Cómo se juega (paso a paso):</div>
        <ol id="gameSteps" class="steps-list"></ol>

        <div class="rule-box">
            <strong>⚠️ Regla de oro:</strong> <span id="gameRule"></span>
        </div>
    </div>
</div>

<script>
    document.getElementById('gameForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const numKids = document.getElementById('numKids').value;
        const ageRange = document.getElementById('ageRange').value;
        const location = document.getElementById('location').value;
        const dynamic = document.getElementById('dynamic').value;

        const checkedMaterials = Array.from(document.querySelectorAll('input[name="materials"]:checked'))
                                      .map(cb => cb.value);

        const loadingDiv = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');

        loadingDiv.style.display = 'block';
        resultCard.style.display = 'none';

        // Prompt reforzado para garantizar máxima claridad y sencillez
        const systemPrompt = `Eres un experto en recreación infantil y educación inicial. Tu meta es inventar un juego ultra divertido pero SÚPER SIMPLE de entender para niños y sus padres.
Usa un lenguaje claro, cotidiano y entusiasta. Evita texto largo, explicaciones complejas o palabras difíciles.

Debes responder ÚNICAMENTE en formato JSON estricto con las siguientes claves:
{
  "titulo": "Nombre corto y llamativo del juego con emojis",
  "mision": "Explicación en UNA sola frase súper clara de qué hay que hacer para ganar o completar el juego.",
  "preparacion": "Cómo acomodar las cosas en menos de 1 minuto.",
  "pasos": [
    "Paso 1 muy corto y directo",
    "Paso 2 muy corto y directo",
    "Paso 3 muy corto y directo (máximo 4 pasos en total)"
  ],
  "reglaOro": "Una sola norma clave o recomendación de seguridad corta."
}`;

        const userPrompt = `Crea un juego simple con estos datos:
- Niños: ${numKids}
- Edades: ${ageRange}
- Lugar: ${location}
- Dinámica: ${dynamic}
- Materiales que tenemos: ${checkedMaterials.join(', ') || 'Ninguno'}`;

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ systemPrompt, userPrompt })
            });

            const data = await response.json();

            if (!response.ok) {
                alert('Error: ' + (data.error || 'Ocurrió un problema al generar el juego.'));
                return;
            }

            // Llenar datos en pantalla
            document.getElementById('gameTitle').textContent = data.titulo || '¡A Jugar!';
            document.getElementById('gameMission').textContent = data.mision || '';
            document.getElementById('gamePrep').textContent = data.preparacion || '';

            const stepsList = document.getElementById('gameSteps');
            stepsList.innerHTML = '';
            if (Array.isArray(data.pasos)) {
                data.pasos.forEach(paso => {
                    const li = document.createElement('li');
                    li.textContent = paso;
                    stepsList.appendChild(li);
                });
            }

            document.getElementById('gameRule').textContent = data.reglaOro || '';

            resultCard.style.display = 'block';

        } catch (err) {
            alert('Error de conexión: ' + err.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
