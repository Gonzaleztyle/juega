<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Juegos Infantiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #A39335;
            --card-bg: #AE83A9;
            --border-color: #000000;
            --primary: #A8241B;
            --primary-hover: #8B1E16;
            --secondary: #0A1C66;
            --secondary-hover: #07134A;
            --accent: #E2DFD2;
            --text-main: #000000;
            --radius: 12px;
            --shadow: 5px 5px 0px #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #D3D3D3;
            font-weight: 700;
            outline: none;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            background: #D3D3D3;
            padding: 8px 10px;
            border-radius: 8px;
            border: 3px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
        }

        .checkbox-label input {
            cursor: pointer;
            accent-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #E2DFD2;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 16px;
            border: 4px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--border-color);
            cursor: pointer;
            transition: all 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .btn-submit:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: var(--accent);
            border: 3px solid var(--border-color);
            border-radius: 10px;
            font-weight: 700;
            box-shadow: 3px 3px 0px var(--border-color);
            text-transform: uppercase;
        }

        #resultCard {
            display: none;
            margin-top: 24px;
            background: var(--accent);
            border: 4px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        #resultCard h2 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 800;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: #000;
            margin-top: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .section-content {
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .steps-list {
            padding-left: 20px;
            margin-top: 4px;
            font-weight: 600;
        }

        .steps-list li {
            margin-bottom: 6px;
        }

        .rule-box {
            background: #FFCCCC;
            border: 3px solid var(--border-color);
            padding: 10px;
            margin-top: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 GENERADOR DE JUEGOS</h1>

    <form id="gameForm">
        <div class="row">
            <div class="form-group">
                <label for="numKids">👥 N° DE NIÑOS:</label>
                <input type="number" id="numKids" min="1" value="2" required>
            </div>
            <div class="form-group">
                <label for="ageRange">🎂 EDADES:</label>
                <input type="text" id="ageRange" value="4 Y 6 AÑOS" placeholder="EJ: 3 A 5 AÑOS" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="location">📍 UBICACIÓN:</label>
                <select id="location">
                    <option value="Interior (Casa)">INTERIOR (CASA)</option>
                    <option value="Exterior (Jardín/Parque)">EXTERIOR (JARDÍN/PARQUE)</option>
                    <option value="Espacio Reducido">ESPACIO REDUCIDO</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dynamic">⚡ DINÁMICA:</label>
                <select id="dynamic">
                    <option value="Creatividad / Construcción">CREATIVIDAD / CONSTRUCCIÓN</option>
                    <option value="Búsqueda del tesoro / Pistas">BÚSQUEDA DEL TESORO / PISTAS</option>
                    <option value="Habilidad / Puntería / Retos">HABILIDAD / PUNTERÍA / RETOS</option>
                    <option value="Juego Simbólico / Roles">JUEGO SIMBÓLICO / ROLES</option>
                    <option value="Moverse / Destreza física">MOVERSE / DESTREZA FÍSICA</option>
                    <option value="Tranquilo / Calma / Arte">TRANQUILO / CALMA / ARTE</option>
                    <option value="Trabajo en equipo">TRABAJO EN EQUIPO</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>📦 MATERIALES DISPONIBLES:</label>
            <div class="materials-grid">
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Agua"> AGUA</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Pinturas y pinceles"> PINTURAS / PINCELES</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Tizas"> TIZAS</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cuerda"> CUERDA</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Lana / Hilo" checked> LANA / HILO</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cojines" checked> COJINES</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Sábanas / Mantas" checked> SÁBANAS / MANTAS</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Papel y lápices" checked> PAPEL / LÁPICES</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cajas de cartón"> CARTÓN</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Cinta adhesiva" checked> CINTA ADHESIVA</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Globos"> GLOBOS</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Vasos / Platos descartables"> VASOS / PLATOS</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Linterna"> LINTERNA</label>
                <label class="checkbox-label"><input type="checkbox" name="materials" value="Pinzas de ropa"> PINZAS DE ROPA</label>
            </div>
        </div>

        <button type="submit" class="btn-submit">✨ GENERAR JUEGO CON GROQ</button>
    </form>

    <div id="loading">🚀 INVENTANDO UNA SÚPER AVENTURA...</div>

    <div id="resultCard">
        <h2 id="gameTitle"></h2>
        
        <div class="section-title">🎯 MISIÓN:</div>
        <p id="gameMission" class="section-content"></p>

        <div class="section-title">🛠️ PREPARACIÓN (1 MINUTO):</div>
        <p id="gamePrep" class="section-content"></p>

        <div class="section-title">🎮 CÓMO SE JUEGA:</div>
        <ol id="gameSteps" class="steps-list"></ol>

        <div class="rule-box">
            <strong>⚠️ REGLA DE ORO:</strong> <span id="gameRule"></span>
        </div>
    </div>
</div>

<script>
    document.getElementById('gameForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const numKids = document.getElementById('numKids').value;
        const ageRange = document.getElementById('ageRange').value;
        const location = document.getElementById('location').value;
        const dynamic = document.getElementById('dynamic').value;

        const checkedMaterials = Array.from(document.querySelectorAll('input[name="materials"]:checked'))
                                      .map(cb => cb.value);

        const loadingDiv = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');

        loadingDiv.style.display = 'block';
        resultCard.style.display = 'none';

        const systemPrompt = `Eres un diseñador experto en juegos infantiles dinámicos, originales y variados. 
TUS REGLAS OBLIGATORIAS:
1. NUNCA propongas siempre carreras o relevos simples a menos que la dinámica explícitamente lo pida. Sé muy creativo aprovechando las características físicas y sensoriales de los materiales seleccionados (ej: usar sábanas para fuertes/refugios, agua para trasvasar/flotar, lana para redes de espías, tizas para laberintos o circuitos de retos, etc.).
2. La explicación debe ser ULTRA SENCILLA y breve, fácil de entender para niños de la edad especificada.
3. El lenguaje debe ser directo, en español neutro, sin párrafos largos.

Debes responder ÚNICAMENTE en formato JSON estricto:
{
  "titulo": "Nombre corto y emocionante del juego",
  "mision": "En 1 sola frase muy clara explica el objetivo final del juego.",
  "preparacion": "Preparación rápida del espacio o materiales en menos de 1 minuto.",
  "pasos": [
    "Paso 1 ultra corto y accionable",
    "Paso 2 ultra corto",
    "Paso 3 ultra corto (máximo 4 pasos)"
  ],
  "reglaOro": "Una regla clave de seguridad, cuidado del hogar o buena convivencia."
}`;

        const userPrompt = `Inventa un juego original con las siguientes características:
- Niños: ${numKids} (${ageRange})
- Lugar: ${location}
- Dinámica deseada: ${dynamic}
- Materiales seleccionados para integrar en el juego: ${checkedMaterials.length > 0 ? checkedMaterials.join(', ') : 'Ningún material específico (usar elementos del entorno)'}`;

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ systemPrompt, userPrompt })
            });

            const data = await response.json();

            if (!response.ok) {
                alert('Error: ' + (data.error || 'Problema al generar el juego.'));
                return;
            }

            document.getElementById('gameTitle').textContent = data.titulo || '¡A Jugar!';
            document.getElementById('gameMission').textContent = data.mision || '';
            document.getElementById('gamePrep').textContent = data.preparacion || '';

            const stepsList = document.getElementById('gameSteps');
            stepsList.innerHTML = '';
            if (Array.isArray(data.pasos)) {
                data.pasos.forEach(paso => {
                    const li = document.createElement('li');
                    li.textContent = paso;
                    stepsList.appendChild(li);
                });
            }

            document.getElementById('gameRule').textContent = data.reglaOro || '';

            resultCard.style.display = 'block';

        } catch (err) {
            alert('Error de conexión: ' + err.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
