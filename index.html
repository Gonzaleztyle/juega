<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYCRAFT AI - JUEGOS SIN PANTALLAS</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #F4EFEB;
            --border-dark: #121212;
            
            /* Paleta extraída de tu documento */
            --color-blue: #2948B5;      /* Tu azul */
            --color-pink: #E2A5D4;      /* Tu rosado */
            --color-yellow: #EFC42D;    /* Tu amarillo */
            --color-red: #D73B26;       /* Tu rojo/coral */
            --color-green: #447865;     /* Tu verde */
            --color-white: #FFFFFF;     /* Blanco */
            --color-black: #121212;     /* Negro */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            text-transform: uppercase;
        }

        body {
            background-color: var(--bg-main);
            color: var(--color-black);
            line-height: 1.4;
            padding: 24px 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        /* AZUL SOBRE AMARILLO */
        .title-block-1 {
            display: inline-block;
            background: var(--color-yellow);
            color: var(--color-blue);
            padding: 12px 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 5px 5px 0px var(--border-dark);
            transform: rotate(-1.5deg);
        }

        .title-block-1 h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--color-blue);
        }

        /* AZUL SOBRE ROJO */
        header p {
            display: inline-block;
            background: var(--color-red);
            color: var(--color-blue);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 900;
            margin-top: 14px;
            border: 2px solid var(--border-dark);
        }

        /* ROSADO SOBRE AZUL */
        .card {
            background: var(--color-blue);
            color: var(--color-pink);
            border-radius: 20px;
            padding: 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* AZUL SOBRE AMARILLO */
        label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            margin-bottom: 8px;
            font-size: 0.85rem;
            padding: 4px 10px;
            background: var(--color-yellow);
            color: var(--color-blue);
            border: 2px solid var(--border-dark);
            box-shadow: 2px 2px 0px var(--border-dark);
            border-radius: 6px;
        }

        /* NEGRO SOBRE BLANCO */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            background: var(--color-white);
            color: var(--color-black);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        /* NEGRO SOBRE BLANCO */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--color-white);
            color: var(--color-black);
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        .checkbox-label input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--color-blue);
        }

        /* VERDE SOBRE ROSADO */
        .btn {
            width: 100%;
            background: var(--color-pink);
            color: var(--color-green);
            border: 3px solid var(--border-dark);
            padding: 14px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* AZUL SOBRE AMARILLO */
        .btn-demo {
            background: var(--color-yellow);
            color: var(--color-blue);
            margin-top: 12px;
        }

        /* ROSADO SOBRE AZUL */
        #api-key-container {
            background: var(--color-blue);
            color: var(--color-pink);
            border: 3px solid var(--border-dark);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-dark);
        }

        #api-key-container label {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            color: var(--color-pink);
            font-weight: 900;
            font-size: 0.9rem;
        }

        #api-key-container small {
            color: var(--color-pink);
            display: block;
            margin-top: 6px;
            font-weight: 800;
        }

        /* RESULTADOS: NEGRO SOBRE BLANCO */
        .card-result {
            background: var(--color-white);
            color: var(--color-black);
            display: none;
            border-radius: 20px;
            padding: 24px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
        }

        .game-header-banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid var(--border-dark);
            margin-bottom: 20px;
        }

        /* AZUL SOBRE ROJO */
        .game-title {
            display: inline-block;
            background: var(--color-red);
            color: var(--color-blue);
            padding: 10px 16px;
            border: 3px solid var(--border-dark);
            box-shadow: 4px 4px 0px var(--border-dark);
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 16px;
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            border: 2px solid var(--border-dark);
        }

        .badge-1 { background: var(--color-yellow); color: var(--color-blue); }
        .badge-2 { background: var(--color-pink); color: var(--color-green); }
        .badge-3 { background: var(--color-red); color: var(--color-blue); }

        .game-section {
            background: var(--color-white);
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            color: var(--color-black);
        }

        .game-section h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            padding: 6px 12px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--border-dark);
        }

        .section-adult h3 { background: var(--color-yellow); color: var(--color-blue); }
        .section-kids h3 { background: var(--color-pink); color: var(--color-green); }
        .section-steps h3 { background: var(--color-red); color: var(--color-blue); }
        .section-extra h3 { background: var(--color-blue); color: var(--color-pink); }

        .game-section p, .game-section ol {
            font-weight: 600;
            color: var(--color-black);
        }

        .game-section ol { padding-left: 20px; }
        .game-section ol li { margin-bottom: 8px; }

        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            background: var(--color-white);
            color: var(--color-black);
            border-radius: 20px;
            border: 3px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--color-blue);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* AZUL SOBRE ROJO */
        .safety-box {
            background: var(--color-red);
            color: var(--color-blue);
            border: 3px solid var(--border-dark);
            padding: 14px;
            border-radius: 14px;
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-block-1">
            <h1>PLAYCRAFT AI</h1>
        </div>
        <br>
        <p>JUEGOS FISICOS Y MANUALIDADES 100% SIN PANTALLAS</p>
    </header>

    <div id="api-key-container">
        <label for="apiKey"><i data-lucide="key"></i> GROQ API KEY (GRATIS):</label>
        <input type="text" id="apiKey" placeholder="gsk_...">
        <small>PEGA TU API KEY DE GROQ O PRUEBA CON EL BOTON DE MUESTRA.</small>
    </div>

    <div class="card">
        <form id="gameForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="numKids"><i data-lucide="users"></i> N DE NINOS:</label>
                    <input type="number" id="numKids" min="1" max="10" value="2" required>
                </div>
                <div class="form-group">
                    <label for="ages"><i data-lucide="baby"></i> EDADES:</label>
                    <input type="text" id="ages" value="4 Y 6 ANOS" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="location"><i data-lucide="map-pin"></i> UBICACION:</label>
                    <select id="location">
                        <option value="Interior (Casa / Depto)">INTERIOR (CASA)</option>
                        <option value="Exterior (Patio / Parque)">EXTERIOR (PATIO/PARQUE)</option>
                        <option value="Espacio muy reducido">ESPACIO REDUCIDO</option>
                        <option value="Habitación a oscuras">HABITACION A OSCURAS</option>
                        <option value="Mesa de comedor / Cocina">MESA / COCINA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="energy"><i data-lucide="zap"></i> DINAMICA:</label>
                    <select id="energy">
                        <option value="Alta energía (Moverse, carreras)">MOVERSE / CARRERAS</option>
                        <option value="Creativo y Manualidades">CREATIVO / ARTE</option>
                        <option value="Tranquilo y Trabajo en equipo">LOGICA / TRANQUILO</option>
                        <option value="Búsqueda del tesoro / Pistas">BUSQUEDA DEL TESORO</option>
                        <option value="Teatro y Roles">TEATRO Y ACTUACION</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i data-lucide="box"></i> MATERIALES DISPONIBLES:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" value="Papel y lápices" checked> PAPEL / LAPICES</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cajas de cartón"> CARTON</label>
                    <label class="checkbox-label"><input type="checkbox" value="Cinta adhesiva" checked> CINTA ADHESIVA</label>
                    <label class="checkbox-label"><input type="checkbox" value="Globos"> GLOBOS</label>
                    <label class="checkbox-label"><input type="checkbox" value="Calcetines o Cojines" checked> CALCETINES / COJINES</label>
                    <label class="checkbox-label"><input type="checkbox" value="Vasos de plástico"> VASOS PLASTICOS</label>
                    <label class="checkbox-label"><input type="checkbox" value="Lana / Hilo"> LANA / HILO</label>
                    <label class="checkbox-label"><input type="checkbox" value="Linterna"> LINTERNA</label>
                    <label class="checkbox-label"><input type="checkbox" value="Platos de papel"> PLATOS DE PAPEL</label>
                    <label class="checkbox-label"><input type="checkbox" value="Pinzas de ropa"> PINZAS DE ROPA</label>
                    <label class="checkbox-label"><input type="checkbox" value="Ninguno (Solo imaginación)"> SOLO MENTE</label>
                </div>
            </div>

            <button type="submit" class="btn"><i data-lucide="sparkles"></i> GENERAR JUEGO CON GROQ</button>
            <button type="button" id="btnMock" class="btn btn-demo"><i data-lucide="play-circle"></i> PROBAR CON RESPUESTA DE PRUEBA</button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="font-weight: 800; font-size: 1.1rem; color: var(--color-black);">INVENTANDO UNA SUPER AVENTURA SEGURA...</p>
    </div>

    <div class="card-result" id="result"></div>

    <script>
        lucide.createIcons();

        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('PEGA TU API KEY DE GROQ O USA EL BOTON AMARILLO DE DEMO.');
                return;
            }
            await generateGame(apiKey);
        });

        document.getElementById('btnMock').addEventListener('click', showMockResult);

        const categoryImages = {
            'Alta energía (Moverse, carreras)': 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80',
            'Creativo y Manualidades': 'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=800&q=80',
            'Tranquilo y Trabajo en equipo': 'https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=800&q=80',
            'Búsqueda del tesoro / Pistas': 'https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=800&q=80',
            'Teatro y Roles': 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=800&q=80'
        };

        async function generateGame(apiKey) {
            const numKids = document.getElementById('numKids').value;
            const ages = document.getElementById('ages').value;
            const location = document.getElementById('location').value;
            const energy = document.getElementById('energy').value;
            
            const materials = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                                   .map(cb => cb.value).join(', ') || 'NINGUNO';

            const systemPrompt = `Eres un experto en pedagogía infantil. Tu trabajo es diseñar un juego FÍSICO Y DESCONECTADO.
REGLAS ABSOLUTAS:
1. NUNCA sugieras pantallas, apps, videos o búsquedas en internet.
2. Formato strictly JSON con los campos: "titulo", "duracion", "preparacion_adulto", "materiales_usados", "reglas_ninos", "pasos_juego", "variante_dificil", "nota_seguridad".
3. Tono apto para todo público, divertido y seguro. Cero peligros físicos.`;

            const userPrompt = `Crea un juego para ${numKids} niños de ${ages}. Ubicación: ${location}. Tipo: ${energy}. Materiales: ${materials}.`;

            showLoading(true);

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        response_format: { type: "json_object" },
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) {
                    alert('ERROR DE GROQ: ' + data.error.message);
                } else {
                    const gameData = JSON.parse(data.choices[0].message.content);
                    renderGame(gameData, categoryImages[energy]);
                }
            } catch (err) {
                alert('ERROR DE CONEXION: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function renderGame(data, imageUrl) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            let pasosHTML = data.pasos_juego.map(paso => `<li>${paso}</li>`).join('');

            resultDiv.innerHTML = `
                <img src="${imageUrl || 'https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80'}" class="game-header-banner">
                <h2 class="game-title">${data.titulo}</h2>
                <div class="badges-container">
                    <div class="badge badge-1"><i data-lucide="clock" size="16"></i> ${data.duracion || '20 MIN'}</div>
                    <div class="badge badge-2"><i data-lucide="package" size="16"></i> ${data.materiales_usados || 'SIMPLES'}</div>
                    <div class="badge badge-3"><i data-lucide="shield-check" size="16"></i> 100% SEGURO</div>
                </div>
                <div class="game-section section-adult">
                    <h3><i data-lucide="wrench" size="18"></i> PREPARACION PARA EL ADULTO:</h3>
                    <p>${data.preparacion_adulto || 'NINGUNA. LISTOS PARA ARRANCAR.'}</p>
                </div>
                <div class="game-section section-kids">
                    <h3><i data-lucide="mega-phone" size="18"></i> INSTRUCCIONES PARA LOS NINOS:</h3>
                    <p style="font-weight: 800;">"${data.reglas_ninos}"</p>
                </div>
                <div class="game-section section-steps">
                    <h3><i data-lucide="gamepad-2" size="18"></i> PASOS DEL JUEGO:</h3>
                    <ol>${pasosHTML}</ol>
                </div>
                ${data.variante_dificil ? `
                <div class="game-section section-extra">
                    <h3><i data-lucide="zap" size="18"></i> MODO DESAFIO EXTRA:</h3>
                    <p>${data.variante_dificil}</p>
                </div>` : ''}
                <div class="safety-box">
                    <strong>NOTA DE SEGURIDAD:</strong> ${data.nota_seguridad || 'ASEGURATE DE DESPEJAR LA ZONA DE JUEGO.'}
                </div>
            `;
            lucide.createIcons();
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showMockResult() {
            showLoading(true);
            const energy = document.getElementById('energy').value;
            setTimeout(() => {
                showLoading(false);
                renderGame({
                    titulo: "EL PUENTE MAGICO DE CALCETINES",
                    duracion: "20 MINUTOS",
                    materiales_usados: "CALCETINES Y CINTA",
                    preparacion_adulto: "PEGA DOS TIRAS DE CINTA EN EL SUELO PARA DELIMITAR EL RIO MISTICO.",
                    reglas_ninos: "EL SUELO DEL SALON ES UN LAGO DE LAVA HIRVIENDO. SALTEN DE ISLA EN ISLA USANDO LOS CALCETINES.",
                    pasos_juego: [
                        "CADA JUGADOR RECIBE 3 PARES DE CALCETINES HECHOS PELOTA.",
                        "DEBEN IR LANZANDO UN CALCETIN HACIA ADELANTE PARA CONSTRUIR SU CAMINO.",
                        "TIENEN QUE RESCATAR LOS TESOROS Y VOLVER A LA ORILLA."
                    ],
                    variante_dificil: "SOLO PUEDEN AVANZAR DANDO SALTOS EN UN SOLO PIE.",
                    nota_seguridad: "RETIRAR MESAS O SILLAS CON ESQUINAS PRONUNCIADAS CERCA DEL AREA DE SALTOS."
                }, categoryImages[energy]);
            }, 700);
        }

        function showLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
            if (isLoading) document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
